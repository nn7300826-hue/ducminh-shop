<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - DucMinh Shop</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#fff;font-family:Arial;padding:20px}.box{width:100%;max-width:400px;background:#101722;border:1px solid #273347;border-radius:18px;padding:26px}h1{text-align:center}span{color:#00d9ff}input{width:100%;padding:13px;margin:8px 0 14px;box-sizing:border-box;background:#080d14;color:#fff;border:1px solid #303c50;border-radius:9px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#00bcd4;color:#fff;font-weight:bold}a{display:block;text-align:center;color:#00d9ff;margin-top:18px}#msg{text-align:center;margin-top:14px}</style></head><body><div class="box"><h1>Duc<span>Minh</span> Shop</h1><p>🔐 Đăng nhập</p><input id="username" placeholder="Tên tài khoản"><input id="password" type="password" placeholder="Mật khẩu"><button onclick="login()">ĐĂNG NHẬP</button><div id="msg"></div><a href="register.html">Chưa có tài khoản? Đăng ký</a><a href="index.html">← Trang chủ</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>function ae(u){return u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'_')+'@auth.ducminhshop.local'}async function login(){let m=document.getElementById('msg'),u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||!p){m.textContent='⚠️ Nhập đầy đủ thông tin.';return}m.textContent='⏳ Đang đăng nhập...';let r=await supabaseClient.auth.signInWithPassword({email:ae(u),password:p});if(r.error)m.textContent='❌ Sai tên tài khoản hoặc mật khẩu.';else location.href='index.html'}</script></body></html>
