<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký - DucMinh Shop</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#fff;font-family:Arial;padding:20px}.box{width:100%;max-width:400px;background:#101722;border:1px solid #273347;border-radius:18px;padding:26px}h1{text-align:center}span{color:#00d9ff}input{width:100%;padding:13px;margin:8px 0 14px;box-sizing:border-box;background:#080d14;color:#fff;border:1px solid #303c50;border-radius:9px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#00bcd4;color:#fff;font-weight:bold}a{display:block;text-align:center;color:#00d9ff;margin-top:18px}#msg{text-align:center;margin-top:14px}</style></head><body><div class="box"><h1>Duc<span>Minh</span> Shop</h1><p>✨ Tạo tài khoản mới</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)"><input id="password2" type="password" placeholder="Nhập lại mật khẩu"><button onclick="register()">TẠO TÀI KHOẢN</button><div id="msg"></div><a href="login.html">Đã có tài khoản? Đăng nhập</a><a href="index.html">← Trang chủ</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
async function register(){const msg=document.getElementById('msg');const email=document.getElementById('email').value.trim();const p=document.getElementById('password').value;const p2=document.getElementById('password2').value;if(!email||!p||!p2){msg.textContent='⚠️ Nhập đầy đủ thông tin.';return}if(p.length<6){msg.textContent='⚠️ Mật khẩu cần ít nhất 6 ký tự.';return}if(p!==p2){msg.textContent='⚠️ Hai mật khẩu không giống nhau.';return}msg.textContent='⏳ Đang tạo tài khoản...';try{const {data,error}=await supabaseClient.auth.signUp({email,password:p});if(error){msg.textContent='❌ '+error.message;return}msg.textContent=data.session?'✅ Tạo tài khoản thành công!':'✅ Đăng ký thành công. Hãy kiểm tra email để xác nhận tài khoản.'}catch(e){msg.textContent='❌ '+e.message}}
</script></body></html>
