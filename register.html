<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký - DucMinh Shop</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#fff;font-family:Arial;padding:20px}.box{width:100%;max-width:400px;background:#101722;border:1px solid #273347;border-radius:18px;padding:26px;box-sizing:border-box}h1{text-align:center}h1 span{color:#00d9ff}input{width:100%;padding:14px;margin:8px 0 14px;box-sizing:border-box;background:#080d14;color:#fff;border:1px solid #303c50;border-radius:9px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#00bcd4;color:#fff;font-weight:bold;font-size:16px}a{display:block;text-align:center;color:#00d9ff;margin-top:18px}#msg{text-align:center;margin-top:14px}</style></head><body><div class="box"><h1>Duc<span>Minh</span> Shop</h1><p>✨ Tạo tài khoản</p><input id="username" maxlength="30" placeholder="Tên tài khoản"><input id="password" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)"><input id="password2" type="password" placeholder="Nhập lại mật khẩu"><button onclick="register()">TẠO TÀI KHOẢN</button><div id="msg"></div><a href="login.html">Đã có tài khoản? Đăng nhập</a><a href="index.html">← Trang chủ</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>async function register(){const m=document.getElementById("msg"),u=document.getElementById("username").value.trim(),p=document.getElementById("password").value,p2=document.getElementById("password2").value;if(!/^[A-Za-z0-9._-]{3,30}$/.test(u)){m.textContent="⚠️ Tên tài khoản 3-30 ký tự, chỉ dùng chữ, số, . _ -";return}if(p.length<6){m.textContent="⚠️ Mật khẩu phải có ít nhất 6 ký tự.";return}if(p!==p2){m.textContent="⚠️ Hai mật khẩu không giống nhau.";return}m.textContent="⏳ Đang tạo tài khoản...";try{const r=await shopRegister(u,p);if(!r||!r.ok){m.textContent="❌ "+(r?.message||"Không thể tạo tài khoản.");return}m.textContent="✅ Tạo tài khoản thành công!";setTimeout(()=>location.href="login.html",800)}catch(e){m.textContent="❌ Lỗi kết nối Supabase: "+e.message}}</script></body></html>
